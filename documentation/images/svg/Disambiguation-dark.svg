<text x="73.0" y="92.0" font-family="F0" font-size="19" fill="var(--ink)" style="font-variation-settings:'wght' 600">I · l · 1</text><text x="73.0" y="113.0" font-family="F0" font-size="13" fill="var(--ink)" opacity="0.5" style="font-variation-settings:'wght' 400">The accessible curved l ships as the default lowercase l</text>
<text x="73.0" y="247.0" font-family="F0" font-size="132" fill="var(--ink)" style="font-variation-settings:'wght' 400">Il1</text><text x="254.4" y="139.0" font-family="F0" font-size="12" fill="var(--ink)" opacity="0.45" style="font-variation-settings:'wght' 500">Default</text><text x="254.4" y="169.0" font-family="F0" font-size="17" fill="var(--ink)" style="font-variation-settings:'wght' 400">The lowercase l carries a tail by default,</text><text x="254.4" y="193.0" font-family="F0" font-size="17" fill="var(--ink)" style="font-variation-settings:'wght' 400">so it cannot collide with capital I or one.</text><text x="254.4" y="227.0" font-family="F0" font-size="12" fill="var(--ink)" opacity="0.45" style="font-variation-settings:'wght' 500">cv16 · Constructed l</text><text x="254.4" y="265.0" font-family="F0" font-size="44" fill="var(--ink)" style="font-variation-settings:'wght' 400;font-feature-settings:'cv16' 1">Il1</text><text x="316.9" y="261.0" font-family="F0" font-size="13" fill="var(--ink)" opacity="0.5" style="font-variation-settings:'wght' 400">straight l, for a more geometric setting</text><text x="73.0" y="313.0" font-family="F0" font-size="21" fill="var(--ink)" style="font-variation-settings:'wght' 400">1 Illinois lightbulb · I’ll fill 1,100 litres</text>
